<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlexFit - Workout</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>

  <div class="app-layout">

    <div class="sidebar">
      <div class="sidebar-logo">🏋️ FlexFit AI</div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html">📊 Dashboard</a>
        <a href="/workout.html" class="active">🏋️ Workout</a>
        <a href="/food.html">🍽️ Food</a>
        <a href="/cardio.html">📈 Cardio</a>
        <a href="/jiya.html">💬 Jiya AI</a>
        <a href="/progress.html">📈 Progress</a>
        <a href="/profile.html">👤 Profile</a>
      </nav>
      <button class="sidebar-signout" style="background:none;border:none;cursor:pointer;text-align:left;width:100%;" onclick="enableReminders()">🔔 Enable Reminders</button>
      <a href="#" class="sidebar-signout" onclick="signOut()">↩ Sign Out</a>
    </div>

    <div class="main-content">
      <div class="workout-page">

        <h1>Workout</h1>
        <p class="subtext">Your weekly split and a curated exercise library.</p>

        <div class="category-tabs">
          <button class="category-tab active" id="tab-split" onclick="switchView('split')">Weekly Split</button>
          <button class="category-tab" id="tab-library" onclick="switchView('library')">Exercise Library</button>
        </div>

        <!-- WEEKLY SPLIT VIEW -->
        <div id="view-split">
          <div id="sport-switcher" class="category-tabs hidden" style="margin-top:14px;"></div>
          <div class="panel-header" style="margin-top:14px;">
            <span id="tailored-label">Tailored to: --</span>
            <button class="btn-secondary" onclick="regenerateSplit()">🔄 AI Regenerate</button>
          </div>
          <div id="day-grid" class="card-grid three-col"></div>
        </div>

        <!-- DAY DETAIL VIEW (shows that day's real sport-specific exercises) -->
        <div id="view-day" class="hidden">
          <button class="btn-secondary" onclick="switchView('split')">← Back to Weekly Split</button>
          <h2 id="day-view-title" style="margin-top:14px;"></h2>
          <div id="day-exercise-grid" class="exercise-grid" style="margin-top:14px;"></div>
        </div>

        <!-- EXERCISE LIBRARY VIEW -->
        <div id="view-library" class="hidden">
          <input type="text" id="exercise-search" placeholder="Search exercises..." oninput="renderExercises()">
          <div id="muscle-tabs" class="category-tabs" style="margin-top:14px;"></div>
          <div id="exercise-grid" class="exercise-grid"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="workoutData.js"></script>
  <script src="notifications.js"></script>
  <script>
    // ---------- STATE ----------
    let sports = [];              // sports saved on the user's profile
    let primarySport = 'General Fitness';
    let archetype = 'general';    // key into ARCHETYPE_TEMPLATES
    let archetypeLabel = 'general fitness';
    let completions = [];
    let activeMuscle = null;
    let regenSeed = 0;            // bumped by "AI Regenerate" to swap in alternate exercises
    let currentDayKey = null;

    const DAY_ORDER = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const REST_DAYS = {
      Tuesday: { icon: '🧘', name: 'Active Recovery', note: 'Recovery day — stretch, walk, sleep well.' },
      Thursday: { icon: '😴', name: 'Rest Day', note: 'Recovery day — stretch, walk, sleep well.' },
      Sunday: { icon: '😴', name: 'Rest Day', note: 'Recovery day — stretch, walk, sleep well.' }
    };
    const TODAY_NAME = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date().getDay()];

    function switchView(view) {
      document.getElementById('view-split').classList.toggle('hidden', view !== 'split');
      document.getElementById('view-library').classList.toggle('hidden', view !== 'library');
      document.getElementById('view-day').classList.toggle('hidden', view !== 'day');
      document.getElementById('tab-split').classList.toggle('active', view === 'split');
      document.getElementById('tab-library').classList.toggle('active', view === 'library');
      if (view === 'library' && document.getElementById('exercise-grid').innerHTML === '') {
        renderMuscleTabs();
        renderExercises();
      }
    }

    // ---------- LOAD / SPORT SWITCHING ----------
    async function loadWorkout(sportOverride) {
      const url = sportOverride ? `/api/workout?sport=${encodeURIComponent(sportOverride)}` : '/api/workout';
      const res = await fetch(url);
      if (res.status === 401) { window.location.href = '/'; return; }
      const data = await res.json();

      sports = data.sports || [];
      primarySport = data.primarySport;
      archetype = data.archetype;
      archetypeLabel = data.archetypeLabel;
      completions = data.completions;
      regenSeed = 0;

      document.getElementById('tailored-label').textContent = `Tailored to: ${primarySport} (${archetypeLabel})`;
      renderSportSwitcher();
      renderDays();
    }

    function renderSportSwitcher() {
      const el = document.getElementById('sport-switcher');
      if (sports.length <= 1) {
        el.classList.add('hidden');
        el.innerHTML = '';
        return;
      }
      el.classList.remove('hidden');
      el.innerHTML = sports.map(s => `
        <button class="category-tab${s === primarySport ? ' active' : ''}" onclick="loadWorkout('${s.replace(/'/g, "\\'")}')">${s}</button>
      `).join('');
    }

    function regenerateSplit() {
      // Rule-based variety: swaps each exercise for another one that targets
      // the same muscle group(s), rather than random/generic AI generation.
      regenSeed++;
      renderDays();
    }

    // ---------- WEEKLY SPLIT (sport-specific) ----------
    function getTemplate() {
      return ARCHETYPE_TEMPLATES[archetype] || ARCHETYPE_TEMPLATES.general;
    }

    // Enrich the archetype's {name, sets, reps} entries with EXERCISE_LIBRARY
    // details (muscles / difficulty / how-to / rest) when a match exists, and
    // optionally swap for an alternate exercise targeting the same muscle(s)
    // when "AI Regenerate" has been clicked.
    function getDayExercises(exList) {
      return exList.map((item, idx) => {
        let libMatch = EXERCISE_LIBRARY.find(le => le.name.toLowerCase() === item.name.toLowerCase());

        if (regenSeed > 0 && libMatch) {
          const candidates = EXERCISE_LIBRARY.filter(le => le.muscles.some(m => libMatch.muscles.includes(m)));
          if (candidates.length > 1) {
            libMatch = candidates[(idx + regenSeed) % candidates.length];
          }
        }

        return {
          name: libMatch ? libMatch.name : item.name,
          sets: item.sets,
          reps: item.reps,
          details: libMatch || { muscles: [], difficulty: null, howTo: null, restSeconds: null }
        };
      });
    }

    function renderDays() {
      const grid = document.getElementById('day-grid');
      grid.innerHTML = '';
      const template = getTemplate();

      DAY_ORDER.forEach(day => {
        const isToday = day === TODAY_NAME;
        const trainDay = template[day];
        const isRest = !trainDay;
        const isDone = completions.some(c => c.day_name === day);

        let icon, name, summary, exerciseCount = 0;

        if (isRest) {
          const restInfo = REST_DAYS[day];
          icon = restInfo.icon;
          name = restInfo.name;
          summary = restInfo.note;
        } else {
          icon = trainDay.icon;
          name = trainDay.name;
          const dayExercises = getDayExercises(trainDay.exercises);
          exerciseCount = dayExercises.length;
          const muscles = [...new Set(dayExercises.flatMap(e => e.details.muscles || []))];
          summary = muscles.length ? muscles.slice(0, 4).join(', ') : `${exerciseCount} exercises`;
        }

        const card = document.createElement('div');
        card.className = 'day-card' + (isToday ? ' today' : '');
        card.innerHTML = `
          <div class="day-badges">
            ${isToday ? '<span class="today-badge">Today</span>' : ''}
            ${isDone ? '<span class="complete-badge">✓ Complete</span>' : ''}
          </div>
          <div class="day-icon">${icon}</div>
          <div class="day-label">${day.toUpperCase()}</div>
          <div class="day-workout-name">${name}</div>
          <div class="summary-label">${summary}</div>
          ${!isRest ? `<a href="#" class="view-exercises-link" onclick="viewDayExercises(event, '${day}')">View Exercises (${exerciseCount}) →</a>` : ''}
          ${!isRest && isToday ? `
            <button class="btn-primary complete-btn" ${isDone ? 'disabled' : ''} onclick="markComplete('${day}','${name}')">${isDone ? '✓ Completed' : 'Mark Complete'}</button>
          ` : ''}
        `;
        grid.appendChild(card);
      });
    }

    // ---------- DAY DETAIL (real exercises for that sport + day) ----------
    function viewDayExercises(e, day) {
      e.preventDefault();
      const template = getTemplate();
      const trainDay = template[day];
      if (!trainDay) return;

      currentDayKey = day;
      const dayExercises = getDayExercises(trainDay.exercises);

      document.getElementById('day-view-title').textContent = `${day} — ${trainDay.name}`;
      switchView('day');
      renderDayExerciseGrid(dayExercises);
    }

    function renderDayExerciseGrid(dayExercises) {
      const grid = document.getElementById('day-exercise-grid');
      grid.innerHTML = '';

      dayExercises.forEach(exItem => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        const diffClass = exItem.details.difficulty ? 'diff-' + exItem.details.difficulty.toLowerCase() : '';
        card.innerHTML = `
          <div class="exercise-header">
            <strong>${exItem.name}</strong>
            ${exItem.details.difficulty ? `<span class="diff-badge ${diffClass}">${exItem.details.difficulty}</span>` : ''}
          </div>
          <div class="summary-label">${exItem.sets} × ${exItem.reps}${exItem.details.restSeconds ? ` · ⏱ ${exItem.details.restSeconds}s rest` : ''}</div>
          ${exItem.details.muscles && exItem.details.muscles.length ? `
            <div class="pill-grid exercise-tags">
              ${exItem.details.muscles.map(m => `<span class="mini-tag">${m}</span>`).join('')}
            </div>` : ''}
          ${exItem.details.howTo ? `
            <details class="how-to">
              <summary>How to do it</summary>
              <p>${exItem.details.howTo}</p>
            </details>` : ''}
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(exItem.name + ' exercise form')}" target="_blank" class="watch-demo-link">▶ Watch demo</a>
        `;
        grid.appendChild(card);
      });
    }

    async function markComplete(day, workoutName) {
      const res = await fetch('/api/workout/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ day_name: day, workout_name: workoutName })
      });
      if (res.ok) {
        completions.push({ day_name: day, workout_name: workoutName });
        renderDays();
      }
    }

    // ---------- EXERCISE LIBRARY (unchanged: full browsable list) ----------
    function renderMuscleTabs() {
      const container = document.getElementById('muscle-tabs');
      container.innerHTML = '';
      if (!activeMuscle) activeMuscle = MUSCLE_GROUPS[0];
      MUSCLE_GROUPS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'category-tab' + (m === activeMuscle ? ' active' : '');
        btn.textContent = m;
        btn.onclick = () => { activeMuscle = m; renderMuscleTabs(); renderExercises(); };
        container.appendChild(btn);
      });
    }

    function renderExercises() {
      const searchTerm = document.getElementById('exercise-search').value.toLowerCase();
      const grid = document.getElementById('exercise-grid');
      grid.innerHTML = '';

      let filtered = EXERCISE_LIBRARY.filter(ex => {
        const matchesSearch = !searchTerm || ex.name.toLowerCase().includes(searchTerm);
        const matchesMuscle = !searchTerm && activeMuscle ? ex.muscles.includes(activeMuscle) : true;
        return searchTerm ? matchesSearch : matchesMuscle;
      });

      filtered.forEach(ex => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        const difficultyClass = 'diff-' + ex.difficulty.toLowerCase();
        card.innerHTML = `
          <div class="exercise-header">
            <strong>${ex.name}</strong>
            <span class="diff-badge ${difficultyClass}">${ex.difficulty}</span>
          </div>
          <div class="summary-label">${ex.sets} × ${ex.reps} · ⏱ ${ex.restSeconds}s rest</div>
          <div class="pill-grid exercise-tags">
            ${ex.muscles.map(m => `<span class="mini-tag">${m}</span>`).join('')}
          </div>
          <details class="how-to">
            <summary>How to do it</summary>
            <p>${ex.howTo}</p>
          </details>
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' exercise form')}" target="_blank" class="watch-demo-link">▶ Watch demo</a>
        `;
        grid.appendChild(card);
      });
    }

    async function signOut() {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    }

    loadWorkout();
  </script>
<script src="theme.js"></script>
</body>
</html>
