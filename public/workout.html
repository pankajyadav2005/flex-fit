<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlexFit - Workout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">

    <div class="sidebar">
      <div class="sidebar-logo">🏋️ FlexFit AI</div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html">📊 Dashboard</a>
        <a href="/workout.html" class="active">🏋️ Workout</a>
        <a href="/food.html">🍽️ Food</a>
        <a href="/cardio.html">📈 Cardio</a>
        <a href="/jiya.html">💬 Jiya AI</a>
        <a href="/progress.html">📈 Progress</a>
        <a href="/profile.html">👤 Profile</a>
      </nav>
      <button class="sidebar-signout" style="background:none;border:none;cursor:pointer;text-align:left;width:100%;" onclick="enableReminders()">🔔 Enable Reminders</button>
      <a href="#" class="sidebar-signout" onclick="signOut()">↩ Sign Out</a>
    </div>

    <div class="main-content">
      <div class="workout-page">

        <h1>Workout</h1>
        <p class="subtext">Your weekly split and a curated exercise library.</p>

        <div class="category-tabs">
          <button class="category-tab active" id="tab-split" onclick="switchView('split')">Weekly Split</button>
          <button class="category-tab" id="tab-library" onclick="switchView('library')">Exercise Library</button>
        </div>

        <!-- WEEKLY SPLIT VIEW -->
        <div id="view-split">
          <div class="panel-header">
            <span id="tailored-label">Tailored to: --</span>
            <button class="btn-secondary" onclick="regenerateSplit()">🔄 AI Regenerate</button>
          </div>
          <div id="day-grid" class="card-grid three-col"></div>
        </div>

        <!-- EXERCISE LIBRARY VIEW -->
        <div id="view-library" class="hidden">
          <input type="text" id="exercise-search" placeholder="Search exercises..." oninput="renderExercises()">
          <div id="muscle-tabs" class="category-tabs" style="margin-top:14px;"></div>
          <div id="exercise-grid" class="exercise-grid"></div>
        </div>

        <!-- VOICE WORKOUT COACH -->
        <div id="voice-coach-modal" class="modal-overlay hidden">
          <div class="modal-box coach-box">
            <h3>🎙️ Voice Workout Coach</h3>
            <p class="subtext" id="coach-status">Say "next" when you finish a set, or use the button below.</p>
            <div class="coach-exercise" id="coach-exercise-name">--</div>
            <div class="summary-label" id="coach-exercise-detail">--</div>
            <div class="coach-timer hidden" id="coach-rest-timer">Rest: <span id="coach-rest-seconds">0</span>s</div>
            <div class="button-row space-between">
              <button class="btn-secondary" onclick="closeCoach()">End Session</button>
              <button class="btn-primary" onclick="coachNext()">Next →</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="workoutData.js"></script>
  <script src="notifications.js"></script>
  <script>
    let currentTemplate = 'Full Body';
    let currentTemplateIndex = 0;
    const templateNames = Object.keys(WEEKLY_TEMPLATES);
    let completions = [];
    let activeMuscle = null;

    const TODAY_NAME = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];

    function switchView(view) {
      document.getElementById('view-split').classList.toggle('hidden', view !== 'split');
      document.getElementById('view-library').classList.toggle('hidden', view !== 'library');
      document.getElementById('tab-split').classList.toggle('active', view === 'split');
      document.getElementById('tab-library').classList.toggle('active', view === 'library');
      if (view === 'library' && document.getElementById('exercise-grid').innerHTML === '') {
        renderMuscleTabs();
        renderExercises();
      }
    }

    async function loadWorkout() {
      const res = await fetch('/api/workout');
      if (res.status === 401) { window.location.href = '/'; return; }
      const data = await res.json();
      currentTemplate = data.templateName;
      currentTemplateIndex = templateNames.indexOf(currentTemplate);
      completions = data.completions;
      document.getElementById('tailored-label').textContent = `Tailored to: ${currentTemplate === 'Full Body' ? 'general fitness' : 'push pull legs'}`;
      renderDays();
    }

    function regenerateSplit() {
      // Rule-based: cycles to the next template rather than random AI generation
      currentTemplateIndex = (currentTemplateIndex + 1) % templateNames.length;
      currentTemplate = templateNames[currentTemplateIndex];
      document.getElementById('tailored-label').textContent = `Tailored to: ${currentTemplate === 'Full Body' ? 'general fitness' : 'push pull legs'}`;
      renderDays();
    }

    function renderDays() {
      const grid = document.getElementById('day-grid');
      grid.innerHTML = '';
      const days = WEEKLY_TEMPLATES[currentTemplate];

      days.forEach(d => {
        const isToday = d.day === TODAY_NAME;
        const isDone = completions.some(c => c.day_name === d.day);
        const card = document.createElement('div');
        card.className = 'day-card' + (isToday ? ' today' : '');
        card.innerHTML = `
          ${isToday ? '<span class="today-badge">Today</span>' : ''}
          <div class="day-icon">${d.icon}</div>
          <div class="day-label">${d.day.toUpperCase()}</div>
          <div class="day-workout-name">${d.name}</div>
          <div class="summary-label">${d.rest ? d.note : d.muscles.join(', ')}</div>
          ${!d.rest ? `<a href="#" class="view-exercises-link" onclick="viewDayExercises(event, '${d.muscles.join(",")}')">View Exercises →</a>` : ''}
          ${!d.rest && isToday ? `
            <button class="btn-secondary coach-btn" onclick='startVoiceCoach(${JSON.stringify(d.muscles)}, "${d.name}", "${d.day}")'>🎙️ Voice Coach</button>
            <button class="btn-primary complete-btn" ${isDone ? 'disabled' : ''} onclick="markComplete('${d.day}','${d.name}')">${isDone ? '✓ Completed' : 'Mark Complete'}</button>
          ` : ''}
        `;
        grid.appendChild(card);
      });
    }

    function viewDayExercises(e, musclesStr) {
      e.preventDefault();
      switchView('library');
      const muscles = musclesStr.split(',');
      activeMuscle = muscles[0];
      renderMuscleTabs();
      renderExercises();
    }

    async function markComplete(day, workoutName) {
      const res = await fetch('/api/workout/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ day_name: day, workout_name: workoutName })
      });
      if (res.ok) {
        completions.push({ day_name: day, workout_name: workoutName });
        renderDays();
      }
    }

    // ---------- EXERCISE LIBRARY ----------
    function renderMuscleTabs() {
      const container = document.getElementById('muscle-tabs');
      container.innerHTML = '';
      if (!activeMuscle) activeMuscle = MUSCLE_GROUPS[0];
      MUSCLE_GROUPS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'category-tab' + (m === activeMuscle ? ' active' : '');
        btn.textContent = m;
        btn.onclick = () => { activeMuscle = m; renderMuscleTabs(); renderExercises(); };
        container.appendChild(btn);
      });
    }

    function renderExercises() {
      const searchTerm = document.getElementById('exercise-search').value.toLowerCase();
      const grid = document.getElementById('exercise-grid');
      grid.innerHTML = '';

      let filtered = EXERCISE_LIBRARY.filter(ex => {
        const matchesSearch = !searchTerm || ex.name.toLowerCase().includes(searchTerm);
        const matchesMuscle = !searchTerm && activeMuscle ? ex.muscles.includes(activeMuscle) : true;
        return searchTerm ? matchesSearch : matchesMuscle;
      });

      filtered.forEach(ex => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        const difficultyClass = 'diff-' + ex.difficulty.toLowerCase();
        card.innerHTML = `
          <div class="exercise-header">
            <strong>${ex.name}</strong>
            <span class="diff-badge ${difficultyClass}">${ex.difficulty}</span>
          </div>
          <div class="summary-label">${ex.sets} × ${ex.reps} · ⏱ ${ex.restSeconds}s rest</div>
          <div class="pill-grid exercise-tags">
            ${ex.muscles.map(m => `<span class="mini-tag">${m}</span>`).join('')}
          </div>
          <details class="how-to">
            <summary>How to do it</summary>
            <p>${ex.howTo}</p>
          </details>
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' exercise form')}" target="_blank" class="watch-demo-link">▶ Watch demo</a>
        `;
        grid.appendChild(card);
      });
    }

    // ---------- VOICE WORKOUT COACH ----------
    let coachExercises = [];
    let coachIndex = 0;
    let coachDay = null;
    let coachWorkoutName = null;
    let recognition = null;
    let restInterval = null;

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel(); // stop any previous speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function startVoiceCoach(muscles, workoutName, day) {
      coachExercises = EXERCISE_LIBRARY.filter(ex => muscles.some(m => ex.muscles.includes(m))).slice(0, 5);
      if (coachExercises.length === 0) {
        alert('No exercises found for this workout.');
        return;
      }
      coachIndex = 0;
      coachDay = day;
      coachWorkoutName = workoutName;
      document.getElementById('voice-coach-modal').classList.remove('hidden');
      announceCurrentExercise();
      startListening();
    }

    function announceCurrentExercise() {
      const ex = coachExercises[coachIndex];
      document.getElementById('coach-exercise-name').textContent = ex.name;
      document.getElementById('coach-exercise-detail').textContent = `${ex.sets} sets × ${ex.reps} reps`;
      document.getElementById('coach-rest-timer').classList.add('hidden');
      speak(`${ex.name}. ${ex.sets} sets of ${ex.reps} reps. Say next when you're done.`);
    }

    function coachNext() {
      const ex = coachExercises[coachIndex];
      coachIndex++;

      if (coachIndex >= coachExercises.length) {
        speak('Workout complete. Great job today!');
        document.getElementById('coach-exercise-name').textContent = '✅ Workout Complete!';
        document.getElementById('coach-exercise-detail').textContent = '';
        markComplete(coachDay, coachWorkoutName);
        stopListening();
        setTimeout(closeCoach, 3000);
        return;
      }

      // Rest period before the next exercise
      const restSeconds = ex.restSeconds;
      speak(`Rest for ${restSeconds} seconds.`);
      const timerEl = document.getElementById('coach-rest-timer');
      const secondsEl = document.getElementById('coach-rest-seconds');
      timerEl.classList.remove('hidden');
      let remaining = restSeconds;
      secondsEl.textContent = remaining;

      clearInterval(restInterval);
      restInterval = setInterval(() => {
        remaining--;
        secondsEl.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(restInterval);
          announceCurrentExercise();
        }
      }, 1000);
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('coach-status').textContent = 'Voice recognition not supported in this browser — use the Next button.';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
        if (transcript.includes('next')) {
          coachNext();
        }
      };

      recognition.onerror = () => {
        document.getElementById('coach-status').textContent = 'Voice recognition had an issue — use the Next button.';
      };

      recognition.onend = () => {
        if (!document.getElementById('voice-coach-modal').classList.contains('hidden')) {
          recognition.start(); // keep listening while the modal is open
        }
      };

      recognition.start();
    }

    function stopListening() {
      if (recognition) {
        recognition.onend = null;
        recognition.stop();
        recognition = null;
      }
    }

    function closeCoach() {
      document.getElementById('voice-coach-modal').classList.add('hidden');
      window.speechSynthesis.cancel();
      clearInterval(restInterval);
      stopListening();
    }

    async function signOut() {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    }

    loadWorkout();
  </script>

</body>
</html>
